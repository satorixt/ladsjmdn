<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTAGRADE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header">
    <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
    </div>
    <div class="header-center">
        <div class="logo">
            <span class="logo-icon">▲</span>
            <span class="logo-text">DOTAGRADE</span>
        </div>
    </div>
    <div class="header-controls">
        <!-- Кнопка входа через Steam (исправлена) -->
        <a href="/auth/steam" class="steam-login-btn" id="steam-login-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam" class="steam-icon">
            Войти через Steam
        </a>
        <button id="sound-toggle" class="sound-btn">🔊</button>
        <button id="profile-btn" class="profile-btn">
            <img src="https://i.pinimg.com/236x/14/42/ea/1442ea15d53abe9cb108abfc1e56dbb5.jpg" alt="Avatar" class="mini-avatar">
        </button>
    </div>
    <div class="header-balance">
        <div class="balance-info">
            <span class="balance-label">Баланс:</span>
            <span class="balance-amount">10 000.00 ₽</span>
        </div>
        <button class="btn-deposit">Пополнить</button>
    </div>
</header>

<div class="main-layout">
    <aside class="left-sidebar">
        <div class="sidebar-tabs">
            <button class="tab-btn active" data-tab="inventory">ИНВЕНТАРЬ</button>
            <button class="tab-btn" data-tab="market">МАГАЗИН</button>
        </div>
        <div class="sidebar-content">
            <div class="tab-content active" id="tab-inventory">
                <div class="grid-container" id="inventory-grid">
                    <div class="empty-message">Ваш инвентарь пуст</div>
                </div>
            </div>
            <div class="tab-content" id="tab-market">
                <div class="grid-container" id="market-grid"></div>
            </div>
        </div>
        <div class="live-feed">
            <div class="live-feed-header"><span class="live-dot"></span> LIVE</div>
            <div class="live-feed-list" id="live-feed-list"></div>
        </div>
    </aside>

    <main class="upgrader-main">
        <div class="item-slot left-slot" id="slot-left">
            <div class="portal-vortex"></div>
            <div class="slot-content hidden" id="slot-left-content">
                <img src="" class="slot-img" id="slot-left-img" alt="">
                <div class="slot-name" id="slot-left-name"></div>
                <div class="slot-price" id="slot-left-price"></div>
            </div>
            <div class="slot-placeholder">ВЫБЕРИТЕ<br>ПРЕДМЕТ</div>
        </div>

        <div class="wheel-section">
            <div class="wheel-container" id="wheel-container">
                <div class="wheel-bg" id="wheel-bg"></div>
                <div class="arrow-wrapper" id="arrow"><div class="arrow-head"></div></div>
                <div class="inner-circle" id="inner-circle">
                    <div class="center-text" id="center-text">50.00%</div>
                    <div class="center-subtext" id="center-subtext">средний шанс</div>
                </div>
            </div>
            <div class="chance-bar"><div class="chance-fill" id="chance-fill"></div></div>
            <button id="spin-btn" class="spin-btn">АПГРЕЙД</button>
            <div class="multipliers" id="multipliers">
                <button class="mult-btn" data-mult="2">x2</button>
                <button class="mult-btn" data-mult="5">x5</button>
                <button class="mult-btn" data-mult="10">x10</button>
                <button class="mult-btn percent-btn" data-percent="35">35%</button>
                <button class="mult-btn percent-btn" data-percent="50">50%</button>
                <button class="mult-btn percent-btn" data-percent="70">70%</button>
            </div>
        </div>

        <div class="right-slot-wrapper">
            <button id="mode-toggle" class="mode-btn floating-mode">⚡</button>
            <div class="item-slot right-slot" id="slot-right">
                <div class="portal-vortex"></div>
                <div class="slot-content hidden" id="slot-right-content">
                    <img src="" class="slot-img" id="slot-right-img" alt="">
                    <div class="slot-name" id="slot-right-name"></div>
                    <div class="slot-price" id="slot-right-price"></div>
                </div>
                <div class="slot-placeholder">ВЫБЕРИТЕ<br>ПРЕДМЕТ</div>
            </div>
        </div>
    </main>

    <aside class="right-sidebar">
        <div class="panel-header"><div class="panel-title">ПРЕДМЕТЫ ДЛЯ АПГРЕЙДА</div></div>
        <div class="panel-content"><div class="grid-container" id="upgrade-grid"></div></div>
    </aside>
</div>

<div id="toast-container" class="toast-container"></div>

<div id="deposit-modal" class="modal">
    <div class="modal-content">
        <h3>Пополнение баланса</h3>
        <input type="number" id="deposit-amount" placeholder="Введите сумму" min="1">
        <div class="modal-actions">
            <button id="deposit-confirm" class="save-btn">Пополнить</button>
            <button id="deposit-cancel" class="close-btn">Отмена</button>
        </div>
    </div>
</div>

<div id="confirm-modal" class="modal">
    <div class="modal-content">
        <h3 id="confirm-title">Подтверждение</h3>
        <p id="confirm-text" style="text-align: center; color: #ccc; margin-bottom: 15px;"></p>
        <div class="modal-actions">
            <button id="confirm-yes" class="save-btn">Да</button>
            <button id="confirm-no" class="close-btn">Нет</button>
        </div>
    </div>
</div>

<div id="profile-modal" class="profile-modal">
    <div class="profile-container">
        <div class="profile-header">
            <button id="close-profile" class="close-profile-btn">✕</button>
            <div class="profile-user-info">
                <img src="https://i.pinimg.com/236x/14/42/ea/1442ea15d53abe9cb108abfc1e56dbb5.jpg" class="profile-avatar" alt="">
                <div class="profile-details">
                    <h2 class="profile-nickname">PlayerOne</h2>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-label">Лучший дроп</span>
                            <span class="stat-value" id="best-drop">Нет</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Выведено в Steam</span>
                            <span class="stat-value" id="steam-withdrawn">0.00 ₽</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="profile-tabs">
            <button class="profile-tab-btn active" data-ptab="items">МОИ ПРЕДМЕТЫ</button>
            <button class="profile-tab-btn" data-ptab="history">ИСТОРИЯ АПГРЕЙДОВ</button>
        </div>
        <div class="profile-content">
            <div class="profile-tab-content active" id="ptab-items">
                <div class="profile-grid" id="profile-inventory-grid"></div>
            </div>
            <div class="profile-tab-content" id="ptab-history">
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
